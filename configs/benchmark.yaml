# Benchmark Configuration for FedUA-Net
# Multi-center cross-silo federated learning on heterogeneous medical imaging

experiment:
  name: "main_uniform_benchmark"
  description: "Standard 12-round multi-task federated learning benchmark across 3 heterogeneous clinical modalities"
  output_dir: "results/verified/main_uniform"
  seeds: [0, 1, 2]
  methods:
    - "fedua"
    - "local_only"
    - "ditto"
    - "centralized"
    - "fedavg"
    - "fedbn"
    - "fedbabu"
    - "fedprox"

federated:
  rounds: 12
  local_epochs: 1
  agg_weight_type: "uniform"   # "uniform" (wk = 1/K = 1/3) or "sample_size"
  fedprox_mu: 0.01
  ditto_lambda: 1.0

optimization:
  optimizer: "AdamW"
  lr: 0.0001
  weight_decay: 0.0001
  batch_size: 32
  loss: "focal_smoothed"
  label_smoothing: 0.1
  focal_gamma: 2.0

model:
  backbone: "efficientnet_v2_s"
  pretrained: true
  attention: "cbam"            # "cbam", "spatial", "channel", "none"
  embed_dim: 512
  dropout: 0.2
  local_bn: true

uncertainty:
  temperature_scaling:
    enabled: true
    max_iter: 50
    lr: 0.01
  conformal:
    enabled: true
    method: "aps"
    alpha_levels: [0.05, 0.10, 0.20]
  selective_classification:
    coverage_thresholds: [0.50, 0.70, 0.80, 0.90, 0.95]

datasets:
  data_root: "Dataset"
  hospital_a:
    name: "Brain Tumor MRI"
    modality: "MRI"
    path: "Dataset/Brain_Tumor_MRI"
    num_classes: 4
    classes: ["glioma", "meningioma", "notumor", "pituitary"]
  hospital_b:
    name: "Breast Ultrasound BUSI"
    modality: "Ultrasound"
    path: "Dataset/Dataset_BUSI_with_mask"
    num_classes: 3
    classes: ["benign", "malignant", "normal"]
    subset_size: null          # null for full dataset (N=546)
  hospital_c:
    name: "COVID-19 Radiography"
    modality: "X-Ray"
    path: "Dataset/COVID-19_Radiography_Dataset"
    num_classes: 4
    classes: ["COVID", "Lung_Opacity", "Normal", "Viral Pneumonia"]
